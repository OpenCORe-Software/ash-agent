name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check the frontend parses
        run: node --check ui/app.js

  build:
    name: Build (x86_64 Linux)
    runs-on: ubuntu-26.04
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --locked --release --bins

      - name: Package
        run: |
          name="ash-agent-${GITHUB_SHA::7}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/ash-agent target/release/ash-agent-root "dist/$name/"
          cp -r icons "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "PACKAGE=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ash-agent-x86_64-linux
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
          retention-days: 30
