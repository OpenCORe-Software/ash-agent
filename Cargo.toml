[package]
name = "ash-agent"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
description = "Ember's AI assistant and desktop helper"
license = "MIT"
default-run = "ash-agent"

[[bin]]
name = "ash-agent"
path = "src/main.rs"

[[bin]]
name = "ash-agent-root"
path = "src/bin/ash-agent-root.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["custom-protocol"] }
tauri-plugin-dialog = "2.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset"] }
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
ksni = "0.3.6"
secret-service = { version = "5.2", features = ["rt-tokio-crypto-rust"] }
reis = { version = "0.7.1", features = ["tokio"] }
enumflags2 = "0.7"
xkbcommon = { version = "0.9", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
libc = "0.2"
dirs = "6"
shlex = "1.3"
regex = "1"
httpdate = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
